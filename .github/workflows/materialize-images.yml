name: Materialize Local Portfolio Images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download image assets
        run: node scripts/sync-site-images.mjs

      - name: Commit local images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images
          if git diff --cached --quiet; then
            echo "No new image assets."
            exit 0
          fi
          git commit -m "Add local portfolio image assets"
          git push
