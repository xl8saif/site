name: AI Skills Validation

on:
  push:
    paths:
      - "ai-skills/**"
      - ".agents/skills/**"
      - "api/skills/**"
      - "public/skills/**"
      - "src/**"
      - "package.json"
      - "vite.config.js"
      - ".github/workflows/ai-skills.yml"
  pull_request:
    paths:
      - "ai-skills/**"
      - ".agents/skills/**"
      - "api/skills/**"
      - "public/skills/**"
      - "src/**"
      - "package.json"
      - "vite.config.js"
      - ".github/workflows/ai-skills.yml"
  workflow_dispatch:

jobs:
  validate-skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Framework self-audit
        run: python ai-skills/core/scripts/self_audit.py
      - name: Check Paperclip skill mirror
        run: python ai-skills/scripts/sync_paperclip_skills.py --check
      - name: Validate open Agent Skills distribution
        run: python ai-skills/scripts/validate_agent_skills.py
      - name: Validate Paperclip agent profiles
        run: python -m json.tool ai-skills/paperclip-agent-profiles.json > /dev/null
      - name: Validate evidence trace schema
        run: python -m json.tool ai-skills/core/evidence.schema.json > /dev/null
      - name: Install pinned SkillSpector security scanner
        run: python -m pip install --upgrade pip && pip install "skillspector==2.11.2"
      - name: Run fail-closed Skill security gate
        run: python ai-skills/core/scripts/skill_security_gate.py --version 2.11.2
      - name: Upload Skill security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skill-security-reports
          path: skill-security-reports/
          if-no-files-found: warn
      - name: Validate Second Brain schemas
        run: |
          python -m json.tool ai-skills/second-brain/schemas/memory.schema.json > /dev/null
          python -m json.tool ai-skills/second-brain/schemas/decision.schema.json > /dev/null
          python -m json.tool ai-skills/second-brain/schemas/source.schema.json > /dev/null
          python ai-skills/second-brain/scripts/validate_memory.py ai-skills/second-brain/schemas/example-memory.jsonl
      - name: Run deterministic Skill Router tests
        run: python ai-skills/scripts/test_router.py
      - name: Run executable Skill planning tests
        run: python ai-skills/scripts/test_plan.py
      - name: Run deterministic execution engine tests
        run: python ai-skills/scripts/test_execute.py
      - name: Run Human Review Gate tests
        run: python ai-skills/scripts/test_review_gate.py
      - name: Validate and evaluate all Skills
        run: python ai-skills/run.py all
      - name: Run framework smoke test
        run: python ai-skills/core/scripts/smoke_test.py
      - name: Compile Skills Console API
        run: python -m py_compile api/skills/run.py
      - name: Run Skills Console API integration smoke test
        run: python api/skills/test_run.py
      - name: Validate Skills Console runtime
        run: node --check public/skills/runtime-fixed.js
      - name: Validate Skills Console app
        run: node --check public/skills/app.js
      - name: Validate Skills Console localization runtime
        run: node --check public/skills/localize-runtime.js
      - name: Validate Second Brain browser runtime
        run: node --check public/skills/second-brain-memory.js
      - name: Compile Second Brain tools
        run: |
          python -m py_compile ai-skills/second-brain/scripts/validate_memory.py
          python -m py_compile ai-skills/second-brain/scripts/build_index.py
          python -m py_compile ai-skills/second-brain/scripts/query_index.py
          python -m py_compile ai-skills/second-brain/scripts/normalize_chatgpt_export.py
          python -m py_compile ai-skills/second-brain/scripts/extract_candidates.py
          python -m py_compile ai-skills/second-brain/scripts/deduplicate_candidates.py
          python -m py_compile ai-skills/second-brain/scripts/detect_conflicts.py
      - name: Validate Skills Console shell
        run: test -f public/skills/index.html && grep -q 'id="pipeline"' public/skills/index.html && grep -q 'id="knowledge"' public/skills/index.html && grep -q 'localize-runtime.js' public/skills/index.html && grep -q 'localizedOutput' public/skills/index.html
      - name: Build portfolio and Skills Console
        run: |
          npm ci
          npm run build
