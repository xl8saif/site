name: AI Skills Validation

on:
  push:
    paths:
      - "ai-skills/**"
  pull_request:
    paths:
      - "ai-skills/**"
  workflow_dispatch:

jobs:
  validate-skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate and evaluate all Skills
        run: python ai-skills/run.py all
